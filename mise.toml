[tools]
dotnet = "10.0.300"

[tasks.build]
description = "Build every mod without changing the game"
run = "python3 scripts/build.py"

[tasks.test]
description = "Check farming and terrain geometry algorithms"
run = "python3 scripts/test.py"

[tasks.publish]
description = "Build DLL, symbols, and mod-manager catalog"
run = "python3 scripts/publish.py"

[tasks.verify]
description = "Verify game patch targets and published ScriptEngine symbols"
run = "python3 scripts/verify.py"

[tasks.install]
description = "Build and copy all local mods into the game's ScriptEngine folder"
run = "python3 scripts/build.py --install"
